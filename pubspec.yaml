name: mindstack
description: Spaced-repetition study app with on-device OCR import. SWE 463 Phase 2 starter project.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  # Range so pub picks the newest go_router your Flutter version supports.
  go_router: '>=14.0.0 <19.0.0'
  fl_chart: ^1.1.0
  lucide_icons_flutter: ^3.1.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  sqlite3: ^3.8.0
  uuid: ^4.6.0
  shared_preferences: ^2.5.6
  file_picker: ^13.3.3
  share_plus: ^13.3.1
  flutter_tts: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true

  # Fonts from the Figma file, bundled so the app works offline (SIL OFL 1.1).
  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-SemiBold.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
