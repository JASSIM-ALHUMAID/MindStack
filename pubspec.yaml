name: mindstack
description: Spaced-repetition study app with on-device OCR import. SWE 463 Phase 2 starter project.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  # Range so pub picks the newest go_router your Flutter version supports.
  go_router: '>=14.0.0 <19.0.0'
  fl_chart: ^1.1.0
  lucide_icons_flutter: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Fonts from the Figma file, bundled so the app works offline (SIL OFL 1.1).
  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-SemiBold.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
